name: 🔐 Obfuscate edgetunnel Worker

on:
  schedule:
    # 每天北京时间早上6点自动执行 (UTC 22:00)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  obfuscate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: 📦 Install javascript-obfuscator
        run: |
          npm install -g javascript-obfuscator

      - name: ⬇️ Download latest edgetunnel worker
        run: |
          curl -sL -o origin.js \
            "https://raw.githubusercontent.com/cmliu/edgetunnel/main/_worker.js"
          echo "Downloaded origin.js ($(wc -c < origin.js) bytes)"

      - name: 🔐 Obfuscate worker code
        run: |
          javascript-obfuscator origin.js --output _worker.js \
            --compact true \
            --control-flow-flattening true \
            --control-flow-flattening-threshold 0.75 \
            --dead-code-injection true \
            --dead-code-injection-threshold 0.4 \
            --identifier-names-generator hexadecimal \
            --rename-globals false \
            --string-array true \
            --string-array-encoding 'rc4' \
            --string-array-threshold 0.75 \
            --transform-object-keys true \
            --unicode-escape-sequence true \
            --split-strings true \
            --split-strings-chunk-length 5
          echo "Obfuscated _worker.js ($(wc -c < _worker.js) bytes)"

      - name: ✅ Verify output
        run: |
          if [ ! -s _worker.js ]; then
            echo "❌ _worker.js is empty!"
            exit 1
          fi
          echo "✅ Obfuscation successful"

      - name: 📝 Commit obfuscated code
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "🔐 Auto-obfuscate: update edgetunnel worker [skip ci]"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          file_pattern: "_worker.js origin.js"
          push_options: "--force-with-lease"
